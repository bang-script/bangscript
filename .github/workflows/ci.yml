name: C++ CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile and run tests
        run: |
          set -e
          mkdir -p build/tests

          # Compile all main sources once (object files)
          for src in src/*.cpp; do
            obj="build/$(basename "$src" .cpp).o"
            echo "=== Compiling $src ==="
            g++ -std=c++17 -Wall -Wextra -O2 -I./src -c "$src" -o "$obj"
          done

          # Link each test with all object files
          for test in tests/*.cpp; do
            name=$(basename "$test" .cpp)
            echo "=== Building test: $name ==="
            g++ -std=c++20 -Wall -Wextra -O2 -I./src \
              "$test" build/*.o -o "build/tests/$name"
            echo "=== Running $name ==="
            "./build/tests/$name"
          done
